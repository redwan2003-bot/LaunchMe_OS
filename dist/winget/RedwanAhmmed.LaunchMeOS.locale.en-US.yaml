ShortDescription: Native Windows 11 full-screen launcher, dynamic notch HUD, multi-display dock, and Golden-Ratio window tiling shell.
Description: |
  LaunchMe OS is an ultra-fluid native Windows 11 desktop workspace shell engineered in C# 13 and .NET 9 with WinUI 3 and Win2D.
  Features include:
  - Crystal Clear Full-Screen Launcher with up-to-1024px G2 super-ellipse squircle icons and Explorer file previews.
  - Snoot Dynamic Notch HUD with live AI agent cockpit (Pookie), file drop shelf, and emotional pet (Blobbo).
  - Multi-Display Dock with Win32 AppBar integration, Touch Bar action strip, and 9-band procedural AudioDSP soundscapes.
  - Full-Screen Music Player with GSMTC live reactive dual-color album ambient backlighting.
  - Squish Golden-Ratio BSP Window Tiling engine with atomic DeferWindowPos placement.
  - Strictly local-first, zero cloud telemetry, and 0% idle GPU footprint via the Pause-on-Hide law.
